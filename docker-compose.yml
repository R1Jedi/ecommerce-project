name: fastapi-ecommerce-prod

services:
  web:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    ports:
      - 8000:8000
    depends_on:
      - db

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=detiop77
      - POSTGRES_DB=ecommerce_db

  nginx:
    build: nginx
    volumes:
      - media_data:/var/www/media
    ports:
      - 80:80
    depends_on:
      - web

volumes:
  postgres_data:
  media_data: